[package]
name = "ree"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first text ingestion and embeddings in SQLite"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sqlite-vec = "=0.1.6"
fs2 = "0.4"
walkdir = "2"
glob = "0.3"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
url = "2"
encoding_rs = "0.8"
chardetng = "0.1"
scraper = "0.24"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "half", "cuda", "download-binaries", "copy-dylibs", "tls-rustls", "api-28"] }
half = "2"
nvml-wrapper = "0.11"
libloading = "0.8"
libc = "0.2"
crossbeam-channel = "0.5"

[dev-dependencies]
assert_cmd = "2"
clap_complete = "4.5"
clap_mangen = "0.2"

[profile.release]
lto = "thin"
strip = true
